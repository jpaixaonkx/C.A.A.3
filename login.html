<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Autenticação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .font-automotive { font-family: 'Orbitron', sans-serif; }
        .font-sans-modern { font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(-45deg, #060913, #15092b, #041d33, #0c0214);
            background-size: 400% 400%;
            animation: gradientMove 20s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .cloud-container {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .colab-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .colab-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="font-sans-modern text-white min-h-screen flex flex-col justify-between p-4 relative overflow-x-hidden">

    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.005)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.005)_1px,transparent_1px)] bg-[size:30px_30px] pointer-events-none z-0"></div>

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center pb-4 border-b border-white/5 z-10">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-car-rear text-purple-400 text-lg"></i>
            <span class="font-automotive font-black tracking-wider text-sm text-white">CERAMINK</span>
        </div>
        <a href="index.html" class="text-xs text-white/40 hover:text-white transition-colors">Voltar ao início</a>
    </header>

    <main class="flex-1 flex items-center justify-center z-10 my-6">
        <div class="cloud-container w-full max-w-sm rounded-2xl p-6 space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold font-automotive tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">Acessar Sistema</h2>
                <p class="text-xs text-white/50">Insira suas credenciais para entrar no seu painel.</p>
            </div>

            <form id="form-login" onsubmit="realizarLogin(event)" class="space-y-4 text-xs">
                <div class="space-y-1">
                    <label class="text-white/60 font-medium">E-mail corporativo ou pessoal</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-white/30"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="login-email" required class="colab-input w-full p-3 pl-10 rounded-xl text-white" placeholder="exemplo@ceramink.com">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-white/60 font-medium">Sua senha de acesso</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-white/30"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="login-senha" required class="colab-input w-full p-3 pl-10 rounded-xl text-white" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btn-entrar" class="w-full bg-gradient-to-r from-purple-500 to-cyan-400 py-3.5 rounded-xl text-sm font-bold uppercase tracking-wider text-black font-semibold mt-2 disabled:opacity-50 transition-all active:scale-[0.98]">
                    Autenticar e Entrar
                </button>
            </form>

            <div class="text-center border-t border-white/5 pt-4">
                <p class="text-xxs text-white/40">Não possui uma conta cadastrada? <a href="cadastro.html" class="text-purple-400 hover:underline">Solicitar Acesso</a></p>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-6xl mx-auto pt-4 border-t border-white/5 text-center text-[9px] text-white/30 font-automotive z-10">
        © 2026 CAA SYSTEM • SEGURANÇA DE ACESSO
    </footer>

    <script>
        // ⚠️ ATENÇÃO: COLOQUE SUAS CREDENCIAIS REAIS DO SUPABASE AQUI
        const SUPABASE_URL = "https://fxetjbrwsjyjpsvlbrdf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_A4meeM1XgSfvr3Lr2mvYxg_4iHskcyU";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function realizarLogin(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-entrar');
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value;

            btn.disabled = true;
            btn.innerText = "Verificando Credenciais...";

            try {
                // 1. Faz o login no Authentication do Supabase
                const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (authError) throw authError;

                // Caso passe sem erro mas o objeto venha vazio por segurança
                if (!authData || !authData.user) {
                    throw new Error("Erro inesperado na geração da sessão de acesso.");
                }

                // 2. Busca a regra do usuário na tabela pública 'usuarios' usando o ID autenticado
                const { data: perfilUsuario, error: dbError } = await _supabase
                    .from('usuarios')
                    .select('regra')
                    .eq('id', authData.user.id)
                    .maybeSingle(); // Usando maybeSingle para evitar quebras se o registro falhar

                if (dbError) throw dbError;

                // Se o e-mail existe na autenticação mas você esqueceu de rodar o SQL para colocá-lo na tabela 'usuarios'
                if (!perfilUsuario) {
                    alert("Aviso: Sua conta de login foi validada, mas seu perfil não foi localizado na tabela de permissões. Direcionando para painel padrão de cliente.");
                    window.location.href = 'cliente.html';
                    return;
                }

                // 3. Redirecionamento Dinâmico Inteligente com base no campo 'regra'
                const regraAcesso = perfilUsuario.regra;

                if (regraAcesso === 'admin') {
                    window.location.href = 'admin.html';
                } else if (regraAcesso === 'colaborador') {
                    window.location.href = 'colaborador.html';
                } else if (regraAcesso === 'cliente') {
                    window.location.href = 'cliente.html';
                } else {
                    // Proteção extra caso exista alguma string inválida inserida manualmente no banco
                    alert("Regra de acesso inválida ou não reconhecida pelo sistema.");
                    window.location.href = 'index.html';
                }

            } catch (err) {
                console.error("Falha detalhada na operação de login:", err);
                alert("Falha no Login: " + (err.message || "Verifique seus dados ou conexão de internet."));
            } finally {
                btn.disabled = false;
                btn.innerText = "Autenticar e Entrar";
            }
        }
    </script>
</body>
</html>
