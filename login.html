<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .font-automotive { font-family: 'Orbitron', sans-serif; }
        .font-sans-modern { font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: linear-gradient(-45deg, #060913, #1e0b36, #092c4e, #0c0214);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .neon-text { text-shadow: 0 0 10px rgba(0, 212, 255, 0.8), 0 0 20px rgba(168, 85, 247, 0.6); }
        .cloud-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .input-field { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field:focus { border-color: #00d4ff; outline: none; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
        .btn-glow { background: linear-gradient(90deg, #00d4ff, #a855f7); }
    </style>
</head>
<body class="font-sans-modern text-white min-h-screen flex flex-col justify-between p-6">
    <header class="w-full max-w-md mx-auto">
        <a href="index.html" class="text-white/60 hover:text-cyan-400 text-sm flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </header>
    <main class="flex flex-col items-center justify-center text-center w-full max-w-md mx-auto my-auto">
        <h2 class="font-automotive text-3xl font-black uppercase mb-1 neon-text">Ceramink</h2>
        <p class="font-automotive text-xxs tracking-[0.2em] text-cyan-400 font-bold uppercase mb-6">Auto Aesthetics</p>
        <div class="cloud-card w-full rounded-2xl p-8 text-left">
            <h3 class="text-xl font-bold mb-5">Acessar Conta</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-white/70">E-mail</label>
                    <input type="email" id="email" required class="input-field w-full py-3 px-4 rounded-xl text-sm" placeholder="exemplo@ceramink.com">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-white/70">Senha</label>
                    <input type="password" id="senha" required class="input-field w-full py-3 px-4 rounded-xl text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-glow w-full py-3.5 rounded-xl font-bold text-sm uppercase mt-4 text-white">Entrar</button>
            </form>
            <div class="relative flex py-4 items-center"><div class="flex-grow border-t border-white/5"></div><span class="mx-3 text-xxs text-white/30 uppercase">Ou</span><div class="flex-grow border-t border-white/5"></div></div>
            <a href="cadastro.html" class="w-full block text-center py-3 rounded-xl border border-white/10 text-xs text-white hover:bg-white/5">Criar uma nova conta</a>
        </div>
    </main>
    <div></div>
    <script>
        function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.toLowerCase();
    
    if (email.includes('admin')) {
        // Se o e-mail contiver "admin", vai para o Painel do Dono
        window.location.href = 'admin.html';
    } else if (email.includes('colab') || email.includes('rodrigo')) {
        // Se contiver "colab" ou o nome do funcionário, vai para o Painel de Produção
        window.location.href = 'colaborador.html';
    } else {
        alert('Login de cliente efetuado! (Ambiente de agendamentos em desenvolvimento)');
    }
}
    </script>
</body>
</html>
