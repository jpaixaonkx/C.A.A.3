<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Espaço do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Mantendo seu visual original intacto */
        body { background: linear-gradient(-45deg, #060913, #0b2240, #1b0a2e, #0c0214); background-size: 400% 400%; animation: gradientMove 20s ease infinite; }
        .cloud-container { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        /* Correção específica do Chat */
        #chat-mensagens { display: flex; flex-direction: column; gap: 8px; }
        .msg-admin { align-self: flex-start; background: rgba(255, 255, 255, 0.1); padding: 8px; border-radius: 12px; max-width: 80%; }
        .msg-usuario { align-self: flex-end; background: #06b6d4; color: black; padding: 8px; border-radius: 12px; max-width: 80%; }
    </style>
</head>
<body class="text-white">

    <header class="max-w-6xl mx-auto flex justify-between items-center p-6 border-b border-white/5">
        <div>
            <span class="text-xs text-white/40 block">Olá, Proprietário</span>
            <h1 id="cliente-nome-topo" class="text-sm font-bold">Carregando...</h1>
        </div>
        <button onclick="desconectar()" class="hover:text-red-400"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </header>

    <div id="chat-widget" class="fixed bottom-5 right-5 z-50">
        <div id="chat-box" class="hidden w-80 h-96 cloud-container rounded-2xl mb-3 flex flex-col overflow-hidden">
            <div class="p-3 border-b border-white/5 flex justify-between items-center bg-black/20">
                <span class="text-xs font-bold text-cyan-400">Suporte Ceramink</span>
                <button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-mensagens" class="flex-1 p-3 overflow-y-auto"></div>
            <form onsubmit="handleEnviarMensagem(event)" class="p-2 border-t border-white/5 bg-black/40 flex gap-2">
                <input type="text" id="chat-input-msg" required class="flex-1 bg-white/5 rounded px-2 text-xs outline-none">
                <button type="submit" class="bg-cyan-500 px-3 rounded text-black text-xs font-bold">Enviar</button>
            </form>
        </div>
        <button onclick="toggleChat()" class="w-12 h-12 rounded-full bg-cyan-600 shadow-xl"><i class="fa-solid fa-comments"></i></button>
    </div>

    <script>
        const _supabase = supabase.createClient('SUA_URL', 'SUA_KEY');
        let usuarioLogado = null;

        async function verificarSessaoEBuscarPerfil() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            usuarioLogado = session.user;

            // Busca nome na tabela usuarios
            const { data: perfil } = await _supabase.from('usuarios').select('nome').eq('id', usuarioLogado.id).single();
            if (perfil) document.getElementById('cliente-nome-topo').innerText = perfil.nome;
            
            carregarMensagensChat();
            carregarCatalogoProdutosEServicos();
        }

        async function carregarCatalogoProdutosEServicos() {
            const { data } = await _supabase.from('servicos_produtos').select('*');
            const select = document.getElementById('agenda-servico');
            if(select && data) {
                select.innerHTML = data.filter(i => i.tipo === 'Serviço')
                    .map(s => `<option value="${s.nome}">${s.nome}</option>`).join('');
            }
        }

        async function carregarMensagensChat() {
            const { data } = await _supabase.from('mensagens_chat').select('*').eq('usuario_id', usuarioLogado.id).order('criado_em', { ascending: true });
            const container = document.getElementById('chat-mensagens');
            container.innerHTML = '';
            data?.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.direcao === 'admin_para_usuario' ? 'msg-admin' : 'msg-usuario';
                div.innerText = msg.texto;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function handleEnviarMensagem(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input-msg');
            await _supabase.from('mensagens_chat').insert([{ usuario_id: usuarioLogado.id, texto: input.value, direcao: 'usuario_para_admin' }]);
            input.value = '';
        }

        async function desconectar() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        function toggleChat() { document.getElementById('chat-box').classList.toggle('hidden'); }

        _supabase.channel('public:mensagens_chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat' }, () => carregarMensagensChat()).subscribe();

        document.addEventListener("DOMContentLoaded", verificarSessaoEBuscarPerfil);
    </script>
</body>
</html>
