<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Espaço do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .font-automotive { font-family: 'Orbitron', sans-serif; }
        .font-sans-modern { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(-45deg, #060913, #0b2240, #1b0a2e, #0c0214); background-size: 400% 400%; animation: gradientMove 20s ease infinite; }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .cloud-container { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); }
        .client-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); }
        /* Correção de Chat */
        .chat-msg-admin { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.05); }
        .chat-msg-user { align-self: flex-end; background: #06b6d4; color: #000; }
    </style>
</head>
<body class="font-sans-modern text-white min-h-screen flex flex-col p-4 md:p-8">

    <header class="w-full max-w-6xl mx-auto flex justify-between items-center pb-6 border-b border-white/5">
        <div class="flex items-center gap-3">
            <h1 id="cliente-nome-topo" class="text-sm md:text-base font-bold text-white">Carregando perfil...</h1>
        </div>
        <button onclick="desconectar()" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center hover:text-red-400">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
    </header>

    <div id="chat-widget" class="fixed bottom-5 right-5 z-50 flex flex-col items-end">
        <div id="chat-box" class="hidden w-80 h-96 cloud-container rounded-2xl mb-3 flex flex-col overflow-hidden">
            <div class="p-3 border-b border-white/5 flex justify-between items-center">
                <span class="text-xs font-bold text-cyan-400">Suporte Ceramink</span>
                <button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-mensagens" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2 text-xs"></div>
            <form onsubmit="handleEnviarMensagem(event)" class="p-2 border-t border-white/5 flex gap-2">
                <input type="text" id="chat-input-msg" required class="flex-1 bg-black/40 rounded-lg p-2 outline-none border border-white/10">
                <button type="submit" class="bg-cyan-500 px-3 rounded-lg text-black font-bold">></button>
            </form>
        </div>
        <button onclick="toggleChat()" class="w-12 h-12 rounded-full bg-cyan-500"><i class="fa-solid fa-comments"></i></button>
    </div>

    <script>
        const _supabase = supabase.createClient('https://pvlssbcljdwtskfaczjt.supabase.co', 'sb_publishable_aWvkKDlc_4kOaZMR47uhHg_EqmRUQuf');
        let usuarioLogado = null;

        async function verificarSessaoEBuscarPerfil() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = 'login.html';
            usuarioLogado = session.user;
            
            const { data } = await _supabase.from('usuarios').select('nome').eq('id', usuarioLogado.id).single();
            document.getElementById('cliente-nome-topo').innerText = data ? data.nome : "Cliente";

            carregarCatalogoProdutosEServicos();
            carregarMensagensChat();
        }

        async function carregarCatalogoProdutosEServicos() {
            const { data } = await _supabase.from('servicos_produtos').select('*');
            const select = document.getElementById('agenda-servico');
            if (select && data) {
                select.innerHTML = data.filter(i => i.tipo === 'Serviço')
                    .map(s => `<option value="${s.nome}">${s.nome} - R$ ${s.valor}</option>`).join('');
            }
        }

        async function carregarMensagensChat() {
            const { data } = await _supabase.from('mensagens_chat').select('*').eq('usuario_id', usuarioLogado.id).order('criado_em', { ascending: true });
            const container = document.getElementById('chat-mensagens');
            container.innerHTML = '';
            data?.forEach(msg => {
                const div = document.createElement('div');
                div.className = `p-2 rounded-xl max-w-[80%] ${msg.direcao === 'admin_para_usuario' ? 'chat-msg-admin' : 'chat-msg-user'}`;
                div.innerText = msg.texto;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function handleEnviarMensagem(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input-msg');
            await _supabase.from('mensagens_chat').insert([{ usuario_id: usuarioLogado.id, texto: input.value, direcao: 'usuario_para_admin' }]);
            input.value = '';
        }

        async function desconectar() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        function toggleChat() { document.getElementById('chat-box').classList.toggle('hidden'); }

        _supabase.channel('chat').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat' }, () => carregarMensagensChat()).subscribe();
        _supabase.channel('servicos').on('postgres_changes', { event: '*', schema: 'public', table: 'servicos_produtos' }, () => carregarCatalogoProdutosEServicos()).subscribe();

        document.addEventListener("DOMContentLoaded", verificarSessaoEBuscarPerfil);
    </script>
</body>
</html>
