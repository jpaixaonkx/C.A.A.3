<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Espaço do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(-45deg, #060913, #0b2240, #1b0a2e); color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .cloud-container { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- CHAT WIDGET -->
    <div id="chat-widget" class="fixed bottom-5 right-5 z-50 flex flex-col items-end">
        <div id="chat-box" class="hidden w-80 h-96 cloud-container rounded-2xl mb-3 flex flex-col overflow-hidden border border-white/10 shadow-2xl">
            <!-- Header do Chat -->
            <div class="p-4 bg-white/5 border-b border-white/10 flex justify-between items-center">
                <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Suporte Ceramink</span>
                <button onclick="toggleChat()" class="text-white/50 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- Container das Mensagens -->
            <div id="chat-mensagens-container" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
            
            <!-- Input de Envio -->
            <form onsubmit="enviarMensagemCliente(event)" class="p-3 border-t border-white/10 bg-black/20 flex gap-2">
                <input type="text" id="chat-input-mensagem" required placeholder="Sua mensagem..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-cyan-400">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-black px-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
        
        <button onclick="toggleChat()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 shadow-xl hover:scale-105 transition-all">
            <i class="fa-solid fa-comments text-xl text-white"></i>
        </button>
    </div>

    <script>
        const _supabase = supabase.createClient('URL_SUPABASE', 'KEY_SUPABASE');
        let usuarioLogado = null;

        async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return;
            usuarioLogado = session.user;
            carregarChat();
            
            // Listen realtime para novas mensagens
            _supabase.channel('mensagens').on('postgres_changes', { 
                event: 'INSERT', schema: 'public', table: 'mensagens_chat' 
            }, () => carregarChat()).subscribe();
        }

        function toggleChat() { document.getElementById('chat-box').classList.toggle('hidden'); }

        async function carregarChat() {
            if (!usuarioLogado) return;
            const { data } = await _supabase.from('mensagens_chat')
                .select('*')
                .eq('usuario_id', usuarioLogado.id)
                .order('criado_em', { ascending: true });

            const boxMsg = document.getElementById('chat-mensagens-container');
            if(!boxMsg) return;
            
            boxMsg.innerHTML = data.length === 0 ? `<div class="text-center p-4 text-white/20 text-xs">Nenhuma mensagem ainda. Inicie o contato!</div>` : '';
            
            data.forEach(m => {
                const isAdmin = m.remetente === 'admin';
                // Igualando o estilo ao Admin: Admin = Cyan/Direita, Cliente = White/Esquerda
                const msgAlign = isAdmin ? 'mr-auto bg-white/5 text-white' : 'ml-auto bg-cyan-500 text-black';
                
                boxMsg.insertAdjacentHTML('beforeend', `
                    <div class="p-3 rounded-xl max-w-[85%] ${msgAlign} shadow-sm">
                        <p class="${isAdmin ? 'text-cyan-400' : 'text-black/60'} font-bold text-[10px] uppercase">
                            ${isAdmin ? 'Suporte' : 'Você'}
                        </p>
                        <p class="break-words text-xs">${m.texto}</p>
                    </div>`);
            });
            boxMsg.scrollTop = boxMsg.scrollHeight;
        }

        async function enviarMensagemCliente(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input-mensagem');
            if (!input.value.trim()) return;

            const { error } = await _supabase.from('mensagens_chat').insert([{
                usuario_id: usuarioLogado.id,
                remetente: 'cliente',
                texto: input.value.trim(),
                criado_em: new Date()
            }]);

            if (!error) {
                input.value = '';
                carregarChat();
            }
        }

        init();
    </script>
</body>
</html>
