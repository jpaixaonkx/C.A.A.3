<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink - Espaço do Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #060913; color: white; }
        .bg-glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .chat-bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; margin: 5px 0; font-size: 0.85rem; }
        .bubble-admin { background: #374151; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bubble-cliente { background: #0891b2; align-self: flex-end; border-bottom-right-radius: 2px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-5xl mx-auto flex justify-between items-center mb-8">
        <div>
            <span class="text-gray-400 text-sm">Bem-vindo,</span>
            <h1 id="nome-cliente" class="text-2xl font-bold">Carregando...</h1>
        </div>
        <button onclick="desconectar()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </header>

    <main class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 space-y-6">
            <div class="bg-glass p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4">Status do Veículo</h2>
                <div id="status-veiculo" class="text-cyan-400 font-semibold text-lg italic">Nenhum veículo ativo</div>
                <p id="descricao-status" class="text-gray-400 text-sm mt-2">Aguardando atualização do admin...</p>
            </div>

            <div class="bg-glass p-6 rounded-2xl">
                <h2 class="text-xl font-bold mb-4">Minha Agenda</h2>
                <div id="lista-agenda" class="space-y-3"></div>
            </div>
        </div>

        <div class="bg-glass rounded-2xl flex flex-col h-[500px]">
            <div class="p-4 border-b border-white/10 font-bold">Suporte</div>
            <div id="chat-mensagens" class="flex-1 overflow-y-auto p-4 flex flex-col"></div>
            <form id="form-chat" class="p-3 border-t border-white/10 flex gap-2">
                <input id="input-chat" type="text" placeholder="Escreva..." class="flex-1 bg-black/30 rounded-lg p-2 text-sm outline-none">
                <button class="bg-cyan-600 px-4 rounded-lg"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient('SUA_URL', 'SUA_KEY');
        let user = null;

        async function init() {
            const { data } = await _supabase.auth.getSession();
            if (!data.session) return window.location.href = 'login.html';
            user = data.session.user;

            // Buscar Perfil
            const { data: perfil } = await _supabase.from('profiles').select('nome').eq('id', user.id).single();
            document.getElementById('nome-cliente').innerText = perfil?.nome || 'Cliente';

            carregarDados();
            setupRealtime();
        }

        function setupRealtime() {
            // Escutar status do veículo e agenda
            _supabase.channel('public:veiculos').on('postgres_changes', { event: '*', schema: 'public', table: 'veiculos' }, carregarDados).subscribe();
            
            // Escutar Chat
            _supabase.channel('public:mensagens').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens_chat' }, (payload) => {
                if (payload.new.usuario_id === user.id) renderizarMensagem(payload.new);
            }).subscribe();
        }

        async function carregarDados() {
            // Carregar Status
            const { data: v } = await _supabase.from('veiculos').select('*').eq('usuario_id', user.id).single();
            if(v) {
                document.getElementById('status-veiculo').innerText = v.status || 'Em processamento';
                document.getElementById('descricao-status').innerText = v.detalhes || '';
            }

            // Carregar Agenda
            const { data: agenda } = await _supabase.from('agenda').select('*').eq('usuario_id', user.id);
            const container = document.getElementById('lista-agenda');
            container.innerHTML = agenda?.map(a => `<div class='bg-black/20 p-3 rounded-lg text-sm'>${a.data} - ${a.servico}</div>`).join('') || 'Nenhuma agenda.';
            
            // Carregar Mensagens
            const { data: msgs } = await _supabase.from('mensagens_chat').select('*').eq('usuario_id', user.id).order('criado_em');
            document.getElementById('chat-mensagens').innerHTML = '';
            msgs?.forEach(renderizarMensagem);
        }

        function renderizarMensagem(msg) {
            const container = document.getElementById('chat-mensagens');
            const ehAdmin = msg.direcao === 'admin_para_usuario';
            const div = document.createElement('div');
            div.className = `chat-bubble ${ehAdmin ? 'bubble-admin' : 'bubble-cliente'}`;
            div.innerText = msg.texto;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('form-chat').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-chat');
            await _supabase.from('mensagens_chat').insert([{ usuario_id: user.id, texto: input.value, direcao: 'usuario_para_admin' }]);
            input.value = '';
        };

        function desconectar() { _supabase.auth.signOut(); window.location.reload(); }
        init();
    </script>
</body>
</html>
