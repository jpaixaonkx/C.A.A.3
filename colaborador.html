<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink | Painel Colaborador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background: linear-gradient(-45deg, #060913, #0b2240, #1b0a2e); min-height: 100vh; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .cloud-container { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .nav-btn { transition: all 0.3s; opacity: 0.6; }
        .nav-btn:hover, .nav-btn.active { opacity: 1; color: #22d3ee; background: rgba(255,255,255,0.05); }
        select, input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-6">

    <header class="max-w-6xl mx-auto flex justify-between items-center pb-6 border-b border-white/10 mb-8">
        <div>
            <h1 class="text-xl font-bold tracking-widest text-cyan-400">CERAMINK PRO</h1>
            <span id="colaborador-nome" class="text-xs text-white/50">Carregando...</span>
        </div>
        <button onclick="desconectar()" class="text-red-400 hover:text-red-300 text-sm"><i class="fa-solid fa-power-off mr-2"></i>Sair</button>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
        <nav class="space-y-2">
            <button onclick="mudarTab('dashboard')" class="nav-btn active w-full text-left p-3 rounded-xl"><i class="fa-solid fa-gauge mr-3"></i>Dashboard</button>
            <button onclick="mudarTab('agenda')" class="nav-btn w-full text-left p-3 rounded-xl"><i class="fa-solid fa-calendar-days mr-3"></i>Agenda</button>
            <button onclick="mudarTab('servicos')" class="nav-btn w-full text-left p-3 rounded-xl"><i class="fa-solid fa-list-check mr-3"></i>Serviços</button>
            <button onclick="mudarTab('venda')" class="nav-btn w-full text-left p-3 rounded-xl"><i class="fa-solid fa-cart-plus mr-3"></i>Lançar Venda</button>
        </nav>

        <section id="content" class="md:col-span-3">
            <div id="tab-dashboard" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="cloud-container p-6 rounded-2xl border-l-4 border-cyan-500">
                        <p class="text-[10px] uppercase text-white/40">Faturamento Total</p>
                        <h2 class="text-2xl font-bold" id="fat-total">R$ 0,00</h2>
                    </div>
                    <div class="cloud-container p-6 rounded-2xl border-l-4 border-purple-500">
                        <p class="text-[10px] uppercase text-white/40">Sua Comissão</p>
                        <h2 class="text-2xl font-bold" id="fat-comissao">R$ 0,00</h2>
                    </div>
                </div>
            </div>

            <div id="tab-agenda" class="hidden cloud-container p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4">Agenda</h2>
                <div id="lista-agenda" class="space-y-3"></div>
            </div>

            <div id="tab-servicos" class="hidden cloud-container p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4">Catálogo</h2>
                <div id="lista-servicos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="tab-venda" class="hidden cloud-container p-6 rounded-2xl">
                <h2 class="text-lg font-bold mb-4">Registrar Nova Venda</h2>
                <form id="form-venda" class="space-y-4">
                    <select id="venda-cliente" class="w-full p-3 rounded-xl text-sm" required></select>
                    <select id="venda-servico" class="w-full p-3 rounded-xl text-sm" required></select>
                    <button class="w-full bg-cyan-600 p-3 rounded-xl font-bold hover:bg-cyan-500">Confirmar Venda</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const _supabase = supabase.createClient('https://pvlssbcljdwtskfaczjt.supabase.co', 'sb_publishable_aWvkKDlc_4kOaZMR47uhHg_EqmRUQuf');
        let userId = null;

        async function init() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return; }
            userId = user.id;

            const { data: perfil } = await _supabase.from('usuarios').select('nome').eq('id', userId).single();
            document.getElementById('colaborador-nome').innerText = `Bem-vindo, ${perfil.nome}`;

            carregarTudo();
            
            _supabase.channel('public:vendas').on('postgres_changes', { event: '*', schema: 'public', table: 'vendas' }, carregarTudo).subscribe();
        }

        async function carregarTudo() {
            carregarDashboard();
            carregarAgenda();
            carregarServicos();
            carregarClientesParaVenda();
        }

        async function carregarDashboard() {
            const { data } = await _supabase.from('vendas').select('valor').eq('colaborador_id', userId);
            const total = (data || []).reduce((acc, v) => acc + (v.valor || 0), 0);
            document.getElementById('fat-total').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('fat-comissao').innerText = `R$ ${(total * 0.1).toFixed(2)}`;
        }

        async function carregarAgenda() {
            const { data } = await _supabase.from('agendamentos').select('*').order('data', { ascending: true });
            const list = document.getElementById('lista-agenda');
            list.innerHTML = (data || []).length ? data.map(item => `
                <div class="bg-black/20 p-4 rounded-xl flex justify-between items-center border border-white/5">
                    <div><p class="font-bold">${item.cliente_nome || 'Cliente'}</p><p class="text-xs text-cyan-400">${item.servico || ''}</p></div>
                    <div class="text-right text-xs"><p>${item.data || ''}</p><p class="font-bold">${item.horario || ''}</p></div>
                </div>
            `).join('') : '<p class="text-white/30 text-center">Nenhum agendamento.</p>';
        }

        async function carregarServicos() {
            const { data } = await _supabase.from('servicos_produtos').select('*');
            document.getElementById('lista-servicos').innerHTML = (data || []).map(s => `
                <div class="cloud-container p-4 rounded-xl">
                    <h3 class="font-bold">${s.nome}</h3>
                    <p class="text-cyan-400 text-sm">R$ ${s.valor}</p>
                </div>
            `).join('');
            
            // Popula select de venda
            document.getElementById('venda-servico').innerHTML = `<option value="">Selecione o Serviço</option>` + (data || []).map(s => `<option value="${s.valor}">${s.nome} (R$ ${s.valor})</option>`).join('');
        }

        async function carregarClientesParaVenda() {
            const { data } = await _supabase.from('usuarios').select('id, nome').eq('funcao', 'cliente');
            document.getElementById('venda-cliente').innerHTML = `<option value="">Selecione o Cliente</option>` + (data || []).map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
        }

        document.getElementById('form-venda').onsubmit = async (e) => {
            e.preventDefault();
            const valor = document.getElementById('venda-servico').value;
            const cliente_id = document.getElementById('venda-cliente').value;
            await _supabase.from('vendas').insert([{ colaborador_id: userId, cliente_id, valor }]);
            alert('Venda registrada com sucesso!');
        };

        function mudarTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function desconectar() { _supabase.auth.signOut(); window.location.href = 'index.html'; }

        init();
    </script>
</body>
</html>
