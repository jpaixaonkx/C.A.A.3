<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ceramink | Painel Colaborador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#060913] text-white flex min-h-screen font-sans">

    <!-- Menu Lateral Flutuante -->
    <aside id="sidebar" class="sidebar w-20 hover:w-64 glass fixed h-[90vh] my-[5vh] ml-4 rounded-3xl shadow-2xl z-50 overflow-hidden flex flex-col justify-between p-6">
        <div class="space-y-10">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-gem text-purple-500 text-2xl"></i>
                <span class="font-bold opacity-0 hover:opacity-100 transition-opacity">CERAMINK</span>
            </div>
            <nav class="space-y-6">
                <a href="#" class="flex items-center gap-4 text-purple-400"><i class="fa-solid fa-chart-pie"></i> <span class="opacity-0 hover:opacity-100">Dashboard</span></a>
                <a href="#" onclick="logout()" class="flex items-center gap-4 text-red-400"><i class="fa-solid fa-power-off"></i> <span class="opacity-0 hover:opacity-100">Sair</span></a>
            </nav>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="ml-32 p-8 w-full">
        <header class="mb-10">
            <h1 class="text-3xl font-bold" id="welcome-msg">Bem-vindo, Operador</h1>
            <p class="text-slate-400">Aqui está o resumo do seu desempenho atual.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass p-6 rounded-3xl">
                <canvas id="meuGrafico"></canvas>
            </div>
            <div class="glass p-6 rounded-3xl">
                <h2 class="text-xl font-bold mb-4">Lançamentos Recentes</h2>
                <div id="lista-vendas" class="space-y-3"></div>
            </div>
        </div>
    </main>

    <script>
        const _supabase = supabase.createClient('SUA_URL', 'SUA_KEY');
        const NOME_COLUNA_USUARIO = "colaborador"; // Ajuste conforme seu banco
        const user = localStorage.getItem('usuario_logado') || 'Colaborador';
        document.getElementById('welcome-msg').innerText = "Olá, " + user;

        async function initDashboard() {
            const { data } = await _supabase.from('vendas').select('*').eq(NOME_COLUNA_USUARIO, user);
            
            // Lógica do Gráfico
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Comissão', 'Produzido'],
                    datasets: [{
                        data: [data.reduce((a, b) => a + (b.valor * 0.3), 0), data.reduce((a, b) => a + b.valor, 0)],
                        backgroundColor: ['#a855f7', '#3b82f6']
                    }]
                }
            });

            // Renderizar Lista
            document.getElementById('lista-vendas').innerHTML = data.map(v => `
                <div class="flex justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                    <span>${v.nome}</span>
                    <span class="font-bold text-green-400">R$ ${v.valor}</span>
                </div>
            `).join('');
        }

        function logout() { localStorage.removeItem('usuario_logado'); location.reload(); }
        initDashboard();
    </script>
</body>
</html>
