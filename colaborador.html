<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ceramink - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #060913; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">Painel do Colaborador</h1>
            <p id="status-conexao" class="text-yellow-500">Conectando ao banco...</p>
        </header>

        <div id="container-vendas" class="space-y-4">
            </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const SUPABASE_URL = "https://fxetjbrwsjyjpsvlbrdf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_A4meeM1XgSfvr3Lr2mvYxg_4iHskcyU";
        
        // ** MUDE ESTA VARIÁVEL PARA O NOME DA SUA COLUNA NO SUPABASE **
        const NOME_COLUNA_USUARIO = "colaborador"; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const USUARIO_LOGADO = localStorage.getItem('usuario_logado') || "Colaborador Geral";

        async function carregarDados() {
            try {
                // Seleciona tudo da tabela vendas
                const { data, error } = await _supabase
                    .from('vendas')
                    .select('*')
                    .eq(NOME_COLUNA_USUARIO, USUARIO_LOGADO)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                document.getElementById('status-conexao').innerText = "● Conectado e Sincronizado";
                document.getElementById('status-conexao').classList.replace('text-yellow-500', 'text-green-500');

                const container = document.getElementById('container-vendas');
                container.innerHTML = data.map(venda => `
                    <div class="p-4 bg-gray-800 rounded border border-gray-700">
                        <p class="font-bold">${venda.nome || 'Serviço'}</p>
                        <p class="text-sm text-gray-400">Valor: R$ ${venda.valor}</p>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Erro:", err);
                document.getElementById('status-conexao').innerText = "Erro: Coluna '" + NOME_COLUNA_USUARIO + "' não encontrada no banco.";
                document.getElementById('status-conexao').classList.replace('text-yellow-500', 'text-red-500');
            }
        }

        // Inicialização
        carregarDados();

        // Realtime para atualizar a tela automaticamente
        _supabase.channel('vendas_realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vendas' }, () => {
                carregarDados();
            })
            .subscribe();
    </script>
</body>
</html>
