<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Colaborador | Ceramink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .fab-button { box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); transition: transform 0.3s; }
        .fab-button:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-[#060913] text-white min-h-screen pb-20">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tight">Ceramink <span class="text-purple-500">Colaborador</span></h1>
            <p id="user-display" class="text-xs text-slate-400">Carregando...</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
            <i class="fa-solid fa-user"></i>
        </div>
    </header>

    <!-- Dashboard Cards -->
    <main class="px-6 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-panel p-4 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase">Comissão</p>
                <p id="comissao-val" class="text-xl font-bold text-purple-400">R$ 0,00</p>
            </div>
            <div class="glass-panel p-4 rounded-2xl">
                <p class="text-[10px] text-slate-400 uppercase">Vendas</p>
                <p id="vendas-val" class="text-xl font-bold">0</p>
            </div>
        </div>

        <div id="historico" class="space-y-3">
            <h2 class="text-sm font-bold text-slate-500 uppercase">Últimos Lançamentos</h2>
            <!-- Dados inseridos via JS -->
        </div>
    </main>

    <!-- Menu Inferior -->
    <nav class="fixed bottom-0 w-full glass-panel p-4 flex justify-around items-center z-40">
        <button class="text-purple-500"><i class="fa-solid fa-house"></i></button>
        <button class="text-slate-500"><i class="fa-solid fa-chart-line"></i></button>
        <button class="text-slate-500" onclick="logout()"><i class="fa-solid fa-power-off"></i></button>
    </nav>

    <!-- Botão Flutuante de Vendas (FAB) -->
    <button onclick="document.getElementById('modal-venda').classList.remove('hidden')" 
            class="fixed bottom-20 right-6 w-14 h-14 bg-purple-600 rounded-full fab-button flex items-center justify-center text-xl z-50">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal Venda -->
    <div id="modal-venda" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-4">
        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl space-y-4">
            <h3 class="font-bold text-lg">Nova Venda</h3>
            <input id="input-item" type="text" placeholder="Serviço/Produto" class="w-full bg-black/50 p-3 rounded-xl border border-slate-700 outline-none">
            <input id="input-valor" type="number" placeholder="Valor" class="w-full bg-black/50 p-3 rounded-xl border border-slate-700 outline-none">
            <button onclick="salvarVenda()" class="w-full bg-purple-600 py-3 rounded-xl font-bold">Registrar</button>
            <button onclick="document.getElementById('modal-venda').classList.add('hidden')" class="w-full text-slate-500">Fechar</button>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('URL', 'KEY');
        const user = localStorage.getItem('usuario_logado') || 'Colaborador';
        document.getElementById('user-display').innerText = user;

        async function salvarVenda() {
            const nome = document.getElementById('input-item').value;
            const valor = document.getElementById('input-valor').value;
            
            // Substitua 'colaborador' pelo nome exato da sua coluna no Supabase
            await _supabase.from('vendas').insert([{ colaborador: user, nome, valor }]);
            alert('Lançado com sucesso!');
            location.reload();
        }

        function logout() {
            localStorage.removeItem('usuario_logado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
