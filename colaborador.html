<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceramink | Painel Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #050505; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stage-active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.2); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 glass m-4 rounded-3xl p-6 flex flex-col justify-between shadow-2xl">
        <div>
            <h2 class="text-2xl font-bold mb-10 text-purple-500 italic">CERAMINK</h2>
            <nav class="space-y-4">
                <button onclick="showPage('dashboard')" class="w-full text-left p-3 hover:bg-white/5 rounded-xl"><i class="fa-solid fa-chart-line mr-3"></i>Dashboard</button>
                <button onclick="showPage('agenda')" class="w-full text-left p-3 hover:bg-white/5 rounded-xl"><i class="fa-solid fa-calendar mr-3"></i>Agenda</button>
                <button onclick="showPage('servicos')" class="w-full text-left p-3 hover:bg-white/5 rounded-xl"><i class="fa-solid fa-box mr-3"></i>Produtos/Serviços</button>
            </nav>
        </div>
        <div class="space-y-4">
            <a href="https://instagram.com/seuusuario" target="_blank" class="block p-3 hover:bg-white/5 rounded-xl"><i class="fa-brands fa-instagram mr-3"></i>Instagram</a>
            <button onclick="logout()" class="w-full text-left p-3 text-red-500 hover:bg-red-500/10 rounded-xl"><i class="fa-solid fa-power-off mr-3"></i>Sair</button>
        </div>
    </aside>

    <main id="content" class="flex-1 p-8 overflow-y-auto">
        <section id="dashboard" class="space-y-6">
            <h1 class="text-3xl font-bold">Resumo Financeiro</h1>
            <div class="grid grid-cols-3 gap-6">
                <div class="glass p-6 rounded-2xl">
                    <p class="text-sm text-slate-400">Total Faturado</p>
                    <h3 class="text-2xl font-bold" id="fat-total">R$ 0,00</h3>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <p class="text-sm text-slate-400">Sua Comissão</p>
                    <h3 class="text-2xl font-bold text-purple-400" id="fat-comissao">R$ 0,00</h3>
                </div>
            </div>
            <div class="glass p-8 rounded-3xl h-64">
                <canvas id="graficoVendas"></canvas>
            </div>
        </section>

        <section id="status-servico" class="glass p-6 rounded-3xl mt-8">
            <h2 class="mb-6 font-bold">Processo de Atendimento</h2>
            <div class="flex justify-between items-center">
                <div class="stage-active p-4 rounded-xl border">1º Garagem</div>
                <div class="p-4 rounded-xl border border-slate-700">2º Estação</div>
                <div class="p-4 rounded-xl border border-slate-700">3º Preparação</div>
                <div class="p-4 rounded-xl border border-slate-700">4º Retirada</div>
            </div>
        </section>
    </main>

    <script>
        const _supabase = supabase.createClient('SUA_URL', 'SUA_KEY');
        const user = localStorage.getItem('usuario_logado');

        // Navegação simples entre seções
        function showPage(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // Logout
        function logout() { localStorage.clear(); window.location.href = 'admin.html'; }

        // Inicialização de Dados
        async function loadData() {
            const { data } = await _supabase.from('vendas').select('*').eq('colaborador', user);
            
            // Lógica do gráfico (Simples e Reativa)
            const ctx = document.getElementById('graficoVendas').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Fev', 'Mar'],
                    datasets: [{ label: 'Faturamento', data: [100, 200, 150], borderColor: '#8b5cf6' }]
                }
            });
        }

        loadData();
    </script>
</body>
</html>
